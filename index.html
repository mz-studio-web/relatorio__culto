<style>
  :root{
    --bg:#F4F5F8; --card:#FFFFFF; --line:#E8EAF0; --text:#1E2436; --muted:#828A99;
    --green:#1D2444; --green-d:#141A33; --green-soft:#EDEEF4;
    --orange:#F59A23; --danger:#E0674B;
    --sh:0 8px 22px -14px rgba(20,26,45,.20); --sh-sm:0 2px 10px -6px rgba(20,26,45,.12);
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:0 0 112px;}

  header{background:var(--card);border-bottom:1px solid var(--line);overflow:hidden;}
  .banner{display:block;width:100%;height:auto;}
  .head-top{display:flex;align-items:center;gap:13px;}
  .logo-badge{width:64px;height:64px;border-radius:20px;background:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;padding:5px;border:1px solid var(--line);box-shadow:var(--sh-sm);}
  .logo-badge img{width:100%;height:100%;object-fit:contain;display:block;}
  .head-text{min-width:0;}
  .church-pre{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 2px;}
  .church{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.12;font-weight:600;margin:0;color:var(--text);}
  .report-title{display:inline-flex;align-items:center;background:var(--green-soft);color:var(--green-d);
    font-weight:700;font-size:13px;padding:7px 15px;border-radius:999px;letter-spacing:.02em;}

  .total{margin:16px;border-radius:var(--r);padding:20px 22px;color:#fff;
    background:linear-gradient(140deg,var(--green) 0%,var(--green-d) 100%);box-shadow:var(--sh);
    display:flex;flex-direction:column;gap:14px;}
  .total-top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .breakdown{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;line-height:1.3;
    color:rgba(255,255,255,.82);border-top:1px solid rgba(255,255,255,.16);padding-top:11px;}
  .breakdown b{color:var(--orange);font-weight:800;font-variant-numeric:tabular-nums;}
  .total .big{font-size:54px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .total .big-label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.92;font-weight:600;margin-top:7px;}
  .total .subs{display:flex;flex-direction:column;gap:11px;text-align:right;}
  .sub-pill b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
  .sub-pill span{font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.92;}

  .section-title{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:24px 20px 10px;}

  .tiles{display:flex;flex-direction:column;gap:10px;padding:0 16px;}
  .tile{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:18px;padding:11px 14px;box-shadow:var(--sh-sm);}
  .tile .cat{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px;color:var(--text);line-height:1.15;}
  .tile .dot{width:32px;height:32px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:#fff;}
  .tile .trow{display:flex;align-items:center;gap:8px;}
  .tile .num{width:44px;text-align:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
    border:none;background:transparent;font-family:inherit;padding:0;}
  .tile .num:focus{outline:none;}
  .num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .num{-moz-appearance:textfield;}
  .stp{width:40px;height:40px;border-radius:13px;border:none;cursor:pointer;font-size:22px;font-weight:600;
    display:flex;align-items:center;justify-content:center;transition:transform .08s ease;flex:none;}
  .stp:active{transform:scale(.87);}
  .stp.minus{background:rgba(255,255,255,.72);color:#61706A;}

  .card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh-sm);margin:0 16px;}
  .card-pad{padding:16px;}

  .segmented{display:flex;flex-wrap:wrap;gap:8px;}
  .seg-btn{flex:1 1 30%;min-width:96px;border:1.5px solid var(--line);background:#fff;color:var(--text);
    border-radius:14px;padding:12px 8px;font-size:13.5px;font-weight:700;font-family:inherit;line-height:1.2;
    text-align:center;cursor:pointer;transition:all .15s ease;}
  .seg-btn.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:var(--sh-sm);}

  .field{display:flex;flex-direction:column;gap:6px;margin-top:15px;}
  .field:first-child{margin-top:0;}
  .field label,.rep-label{font-size:12.5px;font-weight:700;color:var(--muted);}
  .inp{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit;
    background:#FBFCFB;color:var(--text);width:100%;transition:border-color .15s ease,box-shadow .15s ease;}
  .inp:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(29,36,68,.16);}

  .rep{margin-top:15px;}
  .rep-rows{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .rep-row{display:flex;align-items:center;gap:8px;}
  .rep-row .inp{flex:1;}
  .rep-del{width:44px;height:46px;border:none;background:#F5EDEA;color:var(--danger);border-radius:12px;
    font-size:20px;cursor:pointer;flex:none;}
  .rep-add{margin-top:9px;border:1.5px dashed var(--green);background:var(--green-soft);color:var(--green-d);
    font-weight:700;font-size:14px;padding:11px;border-radius:13px;cursor:pointer;font-family:inherit;width:100%;}
  .rep-add:active{filter:brightness(.97);}

  .vis-add{border:1.5px dashed var(--orange);background:#FDECE5;color:#C2542E;font-weight:700;font-size:15px;
    padding:13px;border-radius:14px;cursor:pointer;font-family:inherit;width:100%;}
  .vis-list{display:flex;flex-direction:column;gap:11px;margin-top:12px;}
  .vis-row{display:flex;align-items:center;gap:8px;}
  .vis-row .idx{width:28px;height:28px;border-radius:9px;background:var(--orange);color:#fff;font-size:12.5px;
    font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .vfields{flex:1;display:flex;flex-direction:column;gap:7px;}
  .empty{color:var(--muted);font-size:13.5px;font-style:italic;margin-top:10px;}

  .footer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;}
  .btn{flex:1;border:none;border-radius:15px;padding:14px 10px;font-size:15px;font-weight:800;font-family:inherit;
    cursor:pointer;transition:transform .08s ease;}
  .btn:active{transform:scale(.98);}
  .btn-pdf{flex:1.4;background:linear-gradient(140deg,var(--green),var(--green-d));color:#fff;box-shadow:var(--sh);}
  .btn-save{background:var(--orange);color:#fff;}
  .btn-reset{background:#EEF1EF;color:#41504A;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  .hrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px 12px;}
  .hist-btn{border:1.5px solid var(--line);background:#fff;color:var(--green-d);font-weight:700;font-size:13px;
    padding:8px 13px;border-radius:999px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
  .hist-btn .badge{background:var(--orange);color:#fff;border-radius:999px;font-size:11px;font-weight:800;
    min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .modal{position:fixed;inset:0;background:rgba(18,38,28,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal.open{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;max-height:84vh;
    display:flex;flex-direction:column;box-shadow:0 -12px 34px rgba(18,38,28,.28);}
  .sheet-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .sheet-head h3{margin:0;font-size:16px;font-weight:800;color:var(--text);}
  .sheet-close{border:none;background:#EEF1EF;width:34px;height:34px;border-radius:11px;font-size:19px;cursor:pointer;color:#41504A;}
  .sheet-body{padding:14px 16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .hist-item{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fff;}
  .h-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .h-date{font-weight:800;font-size:15px;color:var(--text);}
  .h-total{background:var(--green-soft);color:var(--green-d);font-weight:800;font-size:12.5px;padding:3px 11px;border-radius:999px;white-space:nowrap;}
  .h-tipo{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .h-acts{display:flex;gap:8px;margin-top:11px;}
  .h-open{flex:1;border:none;border-radius:11px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;background:var(--green);color:#fff;}
  .h-del{flex:0 0 46px;border:none;border-radius:11px;padding:10px;font-weight:700;font-size:18px;cursor:pointer;font-family:inherit;background:#F5EDEA;color:var(--danger);}
  .hist-export{width:100%;border:1.5px dashed var(--green);background:var(--green-soft);color:var(--green-d);
    font-weight:700;font-size:13.5px;padding:11px;border-radius:13px;cursor:pointer;font-family:inherit;margin-top:2px;}
  .hist-empty{color:var(--muted);font-style:italic;text-align:center;padding:26px 0;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#233029;color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;
    transition:opacity .25s ease;pointer-events:none;box-shadow:var(--sh);max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  .hist-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .ht{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--text);border-radius:12px;
    padding:10px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .ht.active{background:var(--green);color:#fff;border-color:var(--green);}
  .stats-period{display:flex;gap:8px;margin-bottom:14px;}
  .sp{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--text);border-radius:999px;
    padding:8px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .sp.active{background:var(--orange);color:#fff;border-color:var(--orange);}
  .stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:var(--green-soft);border-radius:14px;padding:12px 14px;}
  .stat-card b{display:block;font-size:24px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;line-height:1;}
  .stat-card span{font-size:11.5px;color:var(--muted);font-weight:600;}
  .stat-block{margin-top:18px;}
  .stat-block h4{margin:0 0 8px;font-size:13.5px;font-weight:800;color:var(--text);}
  .stat-table{width:100%;border-collapse:collapse;font-size:13.5px;overflow:hidden;border-radius:10px;}
  .stat-table th{text-align:left;background:var(--green);color:#fff;font-weight:700;padding:8px 10px;font-size:12px;}
  .stat-table th:not(:first-child){text-align:right;}
  .stat-table td{padding:8px 10px;border-bottom:1px solid var(--line);}
  .stat-table td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .bar-date{width:66px;font-size:11px;color:var(--muted);flex:none;}
  .bar-track{flex:1;height:14px;background:var(--green-soft);border-radius:999px;overflow:hidden;}
  .bar-fill{display:block;height:100%;background:var(--green);border-radius:999px;}
  .bar-val{width:34px;text-align:right;font-size:12.5px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;flex:none;}

</style>

<div class="wrap">
  <header>
    <img class="banner" id="bannerImg" alt="Relatório do Culto — Igreja Evangélica Assembleia de Deus, Alfa e Omega do Trevo">
    <div class="hrow">
      <button class="hist-btn" id="histBtn" type="button">Histórico <span class="badge" id="histCount">0</span></button>
    </div>
  </header>

  <div class="total">
    <div class="total-top">
      <div>
        <div class="big" id="totalNum">0</div>
        <div class="big-label">Total de presentes</div>
      </div>
      <div class="subs">
        <div class="sub-pill"><b id="ancCount">0</b><span>Anciãos</span></div>
        <div class="sub-pill"><b id="visCount">0</b><span>Visitantes</span></div>
        <div class="sub-pill"><b id="novosCount">0</b><span>Novos convertidos</span></div>
      </div>
    </div>
    <div class="breakdown" id="catBreakdown"></div>
  </div>

  <div class="section-title">Tipo de culto</div>
  <div class="card"><div class="card-pad">
    <div class="segmented" id="tipoSeg"></div>
  </div></div>

  <div class="section-title">Presenças por categoria</div>
  <div class="tiles" id="tiles"></div>

  <div id="ceiaWrap" style="display:none">
    <div class="section-title">Santa Ceia (1º Domingo)</div>
    <div class="tiles" id="ceiaTiles"></div>
  </div>

  <div class="section-title">Visitantes</div>
  <div class="card"><div class="card-pad">
    <button class="vis-add" id="addVis">+ Adicionar visitante</button>
    <div class="vis-list" id="visList"></div>
  </div></div>

  <div class="section-title">Dados do culto</div>
  <div class="card"><div class="card-pad">
    <div class="field"><label for="data">Data do culto</label><input class="inp" type="date" id="data"></div>
    <div class="field"><label for="f_dirigente">Dirigente</label><input class="inp" id="f_dirigente" type="text" autocomplete="off"></div>

    <div class="rep" data-key="corista">
      <div class="rep-label">Coristas</div>
      <div class="rep-rows"></div>
      <button class="rep-add" type="button">+ Adicionar corista</button>
    </div>

    <div class="rep" data-key="musico">
      <div class="rep-label">Músicos</div>
      <div class="rep-rows"></div>
      <button class="rep-add" type="button">+ Adicionar músico</button>
    </div>

    <div class="rep" data-key="protocolo">
      <div class="rep-label">Protocolos</div>
      <div class="rep-rows"></div>
      <button class="rep-add" type="button">+ Adicionar protocolo</button>
    </div>

    <div class="field"><label for="f_leitura">Leitura oficial</label><input class="inp" id="f_leitura" type="text" autocomplete="off"></div>
    <div class="field"><label for="f_pregador">Pregador</label><input class="inp" id="f_pregador" type="text" autocomplete="off"></div>
    <div class="field"><label for="f_tradutor">Tradutor</label><input class="inp" id="f_tradutor" type="text" autocomplete="off"></div>
    <div class="field"><label for="f_tema">Tema</label><input class="inp" id="f_tema" type="text" autocomplete="off"></div>

    <div class="rep" data-key="referencia">
      <div class="rep-label">Texto Base</div>
      <div class="rep-rows"></div>
      <button class="rep-add" type="button">+ Adicionar texto</button>
    </div>
  </div></div>
</div>

<div class="footer">
  <button class="btn btn-reset" id="resetBtn">Novo</button>
  <button class="btn btn-save" id="saveBtn">Guardar</button>
  <button class="btn btn-pdf" id="pdfBtn">Gerar PDF</button>
</div>

<div class="modal" id="histModal">
  <div class="sheet">
    <div class="sheet-head"><h3>Histórico de cultos</h3><button class="sheet-close" id="histClose" type="button">×</button></div>
    <div class="sheet-body" id="histBody"></div>
  </div>
</div>

  function setToday(){var d=new Date();document.getElementById("data").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  (function(){ var bi=document.getElementById("bannerImg"); if(bi && BANNER_DATA.indexOf("data:image")===0) bi.src=BANNER_DATA; setToday(); })();

  var tilesEl=document.getElementById("tiles");
  var tileInputs={};
  var TBG="#EDEEF4", TAC="#2A3560";
  function buildTile(c, onMinus, onPlus, onInput, idAttr){
    var t=document.createElement("div"); t.className="tile"; t.style.background=TBG;
    t.innerHTML='<div class="cat"><span class="dot" style="background:'+TAC+'">'+c.ini+'</span>'+c.name+'</div>'+
      '<div class="trow">'+
        '<button class="stp minus" type="button" aria-label="Diminuir">\u2212</button>'+
        '<input class="num"'+(idAttr?' id="'+idAttr+'"':'')+' style="color:'+TAC+'" type="number" inputmode="numeric" min="0" value="0">'+
        '<button class="stp plus" type="button" style="background:'+TAC+';color:#fff" aria-label="Aumentar">+</button>'+
      '</div>';
    var input=t.querySelector(".num"); tileInputs[c.name]=input;
    t.querySelector(".minus").addEventListener("click",function(){onMinus(input);});
    t.querySelector(".plus").addEventListener("click",function(){onPlus(input);});
    input.addEventListener("input",function(){onInput(input);});
    tilesEl.appendChild(t);
  }
  CATS.forEach(function(c){
    buildTile(c,
      function(inp){counts[c.name]=Math.max(0,counts[c.name]-1);inp.value=counts[c.name];renderTotals();},
      function(inp){counts[c.name]=counts[c.name]+1;inp.value=counts[c.name];renderTotals();},
      function(inp){var v=parseInt(inp.value,10);if(isNaN(v)||v<0)v=0;counts[c.name]=v;renderTotals();}
    );
  });
  buildTile(ANCIAOS,
    function(inp){ancioes=Math.max(0,ancioes-1);inp.value=ancioes;renderTotals();},
    function(inp){ancioes=ancioes+1;inp.value=ancioes;renderTotals();},
    function(inp){var v=parseInt(inp.value,10);if(isNaN(v)||v<0)v=0;ancioes=v;renderTotals();},
    "ancNum"
  );
  buildTile(NOVOS,
    function(inp){novos=Math.max(0,novos-1);inp.value=novos;renderTotals();},
    function(inp){novos=novos+1;inp.value=novos;renderTotals();},
    function(inp){var v=parseInt(inp.value,10);if(isNaN(v)||v<0)v=0;novos=v;renderTotals();},
    "ncNum"
  );

  function ceiaTile(box,name,ini,getV,setV){
    var t=document.createElement("div"); t.className="tile"; t.style.background=TBG;
    t.innerHTML='<div class="cat"><span class="dot" style="background:'+TAC+'">'+ini+'</span>'+name+'</div>'+
      '<div class="trow"><button class="stp minus" type="button" aria-label="Diminuir">\u2212</button>'+
      '<input class="num" style="color:'+TAC+'" type="number" inputmode="numeric" min="0" value="0">'+
      '<button class="stp plus" type="button" style="background:'+TAC+';color:#fff" aria-label="Aumentar">+</button></div>';
    var input=t.querySelector(".num");
    t.querySelector(".minus").addEventListener("click",function(){setV(Math.max(0,getV()-1));input.value=getV();});
    t.querySelector(".plus").addEventListener("click",function(){setV(getV()+1);input.value=getV();});
    input.addEventListener("input",function(){var v=parseInt(input.value,10);if(isNaN(v)||v<0)v=0;setV(v);});
    box.appendChild(t); return input;
  }
  (function(){
    var box=document.getElementById("ceiaTiles");
    ceiaMembrosInput=ceiaTile(box,"Membros participantes","Mb",function(){return ceiaMembros;},function(v){ceiaMembros=v;});
    ceiaTomaramInput=ceiaTile(box,"Tomaram a Ceia","Ce",function(){return ceiaTomaram;},function(v){ceiaTomaram=v;});
  })();
  function updateCeia(){ var w=document.getElementById("ceiaWrap"); if(w) w.style.display=(tipo==="Culto de Santa Ceia (1º Domingo)")?"":"none"; }

  function renderTotals(){
    var total=CATS.reduce(function(s,c){return s+counts[c.name];},0);
    document.getElementById("totalNum").textContent=total;
    document.getElementById("visCount").textContent=visitantes.length;
    document.getElementById("novosCount").textContent=novos;
    var ac=document.getElementById("ancCount"); if(ac)ac.textContent=ancioes;
    var el=document.getElementById("catBreakdown");
    if(el)el.innerHTML=CATS.map(function(c){return '<span>'+c.name+': <b>'+counts[c.name]+'</b></span>';}).join("");
    scheduleAutoSave();
  }
  renderTotals();

  var tipoSeg=document.getElementById("tipoSeg");
  TIPOS.forEach(function(t){
    var b=document.createElement("button"); b.type="button";
    b.className="seg-btn"+(t.v===tipo?" active":""); b.textContent=t.label;
    b.addEventListener("click",function(){
      tipo=t.v;
      tipoSeg.querySelectorAll(".seg-btn").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      updateCeia();
      scheduleAutoSave();
    });
    tipoSeg.appendChild(b);
  });
  updateCeia();

  var REP_PLACE={corista:"Corista",musico:"Músico",protocolo:"Protocolo",referencia:"Texto base"};
  document.querySelectorAll(".rep").forEach(function(rep){
    var key=rep.getAttribute("data-key");
    var rows=rep.querySelector(".rep-rows");
    var addBtn=rep.querySelector(".rep-add");
    function renumber(){
      var list=rows.querySelectorAll(".rep-row");
      list.forEach(function(r,i){
        r.querySelector("input").placeholder=REP_PLACE[key]+" "+(i+1);
        r.querySelector(".rep-del").style.display=list.length>1?"":"none";
      });
    }
    function addRow(){
      var row=document.createElement("div"); row.className="rep-row";
      row.innerHTML='<input class="inp" type="text" autocomplete="off"><button class="rep-del" type="button" aria-label="Remover">\u00d7</button>';
      row.querySelector(".rep-del").addEventListener("click",function(){
        if(rows.querySelectorAll(".rep-row").length>1){row.remove();renumber();}
        else {row.querySelector("input").value="";}
      });
      rows.appendChild(row); renumber(); return row;
    }
    addBtn.addEventListener("click",function(){ addRow().querySelector("input").focus(); });
    addRow();
    repMap[key]={
      reset:function(){rows.innerHTML="";addRow();},
      values:function(){var out=[];rows.querySelectorAll("input").forEach(function(i){var v=i.value.trim();if(v)out.push(v);});return out;},
      setValues:function(vals){rows.innerHTML="";if(!vals||vals.length===0){addRow();}else{vals.forEach(function(v){var r=addRow();r.querySelector("input").value=v;});}}
    };
  });

  var visList=document.getElementById("visList");
  document.getElementById("addVis").addEventListener("click",function(){
    visitantes.push({nome:"",origem:""}); renderVis(); renderTotals();
    var n=visList.querySelectorAll(".vname"); if(n.length)n[n.length-1].focus();
  });
  function renderVis(){
    visList.innerHTML="";
    if(visitantes.length===0){ visList.innerHTML='<div class="empty">Ainda sem visitantes registados.</div>'; return; }
    visitantes.forEach(function(v,i){
      var row=document.createElement("div"); row.className="vis-row";
      var nome=(v.nome||"").replace(/"/g,"&quot;"); var orig=(v.origem||"").replace(/"/g,"&quot;");
      row.innerHTML='<span class="idx">'+(i+1)+'</span>'+
        '<div class="vfields">'+
          '<input class="inp vname" type="text" placeholder="Nome do visitante" value="'+nome+'">'+
          '<input class="inp vorig" type="text" placeholder="De onde vem?" value="'+orig+'">'+
        '</div>'+
        '<button class="rep-del" type="button" aria-label="Remover">\u00d7</button>';
      row.querySelector(".vname").addEventListener("input",function(e){visitantes[i].nome=e.target.value;});
      row.querySelector(".vorig").addEventListener("input",function(e){visitantes[i].origem=e.target.value;});
      row.querySelector(".rep-del").addEventListener("click",function(){visitantes.splice(i,1);renderVis();renderTotals();});
      visList.appendChild(row);
    });
  }
  renderVis();

  document.getElementById("resetBtn").addEventListener("click",function(){
    if(!confirm("Começar um novo culto? Os dados atuais serão apagados.")) return;
    CATS.forEach(function(c){counts[c.name]=0;}); novos=0; ancioes=0; ceiaMembros=0; ceiaTomaram=0; visitantes=[]; tipo="Culto Normal";
    tilesEl.querySelectorAll(".num").forEach(function(i){i.value=0;});
    if(ceiaMembrosInput)ceiaMembrosInput.value=0; if(ceiaTomaramInput)ceiaTomaramInput.value=0; updateCeia();
    tipoSeg.querySelectorAll(".seg-btn").forEach(function(x,i){x.classList.toggle("active",TIPOS[i].v===tipo);});
    ["f_dirigente","f_pregador","f_tradutor","f_tema","f_leitura"].forEach(function(id){document.getElementById(id).value="";});
    Object.keys(repMap).forEach(function(k){repMap[k].reset();});
    editingId=null;
    setToday(); renderVis(); renderTotals();
    window.scrollTo({top:0,behavior:"smooth"});
  });

  // ---- Histórico local (neste dispositivo) ----
  var toastTimer;
  function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show");},2200);}
  var cache=null;
  function lsGet(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return [];}}
  function lsSet(a){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(a));}catch(e){}}
  function getHist(){ if(cache===null)cache=lsGet(); return cache; }
  function setHist(a){
    cache=a; lsSet(a);
    if(window._fsDoc){ try{ window._fsDoc.set({cultos:a,updatedAt:Date.now()}); }catch(e){} }
    return true;
  }
  function initCloud(){
    try{
      if(typeof firebase==="undefined") return;
      if(!firebaseConfig || !firebaseConfig.projectId || /COLE_AQUI/.test(firebaseConfig.projectId)) return;
      firebase.initializeApp(firebaseConfig);
      var db=firebase.firestore();
      try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
      window._fsDoc=db.collection("relatorio_culto").doc("historico");
      window._fsDoc.onSnapshot(function(snap){
        var d=(snap&&snap.exists)?snap.data():null; var arr=(d&&d.cultos)||[];
        cache=arr; lsSet(arr); updateBadge();
        var m=document.getElementById("histModal"); if(m&&m.classList.contains("open")) renderHist();
        if(!window._fsSynced){ window._fsSynced=true; toast("Histórico ligado à nuvem"); }
      }, function(err){});
    }catch(e){}

    var headFill=[29,36,68], headText=[255,255,255], greenTint=[237,239,245];

    var hasLogo=(LOGO_DATA && LOGO_DATA.indexOf("data:image")===0);
    doc.setFillColor(247,248,251); doc.rect(0,0,W,92,"F");
    doc.setFillColor(245,154,35); doc.rect(0,0,W,5,"F");
    doc.setDrawColor(226,232,228); doc.line(0,92,W,92);
    if(hasLogo){ try{ doc.addImage(LOGO_DATA,"PNG",(W-62)/2,16,62,62); }catch(e){} }

    var y=116;
    doc.setTextColor(29,36,68); doc.setFont("helvetica","bold"); doc.setFontSize(14);
    doc.text("Relatório do Culto", M, y); y+=18;
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110,120,113);
    doc.text("Data do culto: "+fmtDate(val("data")), M, y);
    var gen=new Date();
    doc.text("Gerado em: "+String(gen.getDate()).padStart(2,"0")+"/"+String(gen.getMonth()+1).padStart(2,"0")+"/"+gen.getFullYear(), W-M, y, {align:"right"});
    y+=17;
    doc.setFont("helvetica","bold"); doc.setTextColor(29,36,68);
    doc.text("Tipo de culto: "+tipo, M, y); doc.setFont("helvetica","normal");

    y+=20; doc.setFontSize(10.5);
    function infoLine(label,txt){
      doc.setFont("helvetica","bold"); doc.setTextColor(29,36,68); doc.text(label+": ", M, y);
      var lw=doc.getTextWidth(label+": ");
      doc.setFont("helvetica","normal"); doc.setTextColor(55,62,78); doc.text(String(txt||"—"), M+lw, y);
      y+=16;
    }
    infoLine("Leitura oficial", val("f_leitura"));
    infoLine("Pregador", val("f_pregador"));
    infoLine("Tema", val("f_tema"));
    infoLine("Texto base", jr("referencia"));

    var culto=[
      ["Dirigente", val("f_dirigente")||"—"],
      ["Coristas", jr("corista")],
      ["Músicos", jr("musico")],
      ["Protocolos", jr("protocolo")],
      ["Leitura oficial", val("f_leitura")||"—"],
      ["Pregador", val("f_pregador")||"—"],
      ["Tradutor", val("f_tradutor")||"—"],
      ["Tema", val("f_tema")||"—"],
      ["Texto Base", jr("referencia")]
    ];
    doc.autoTable({startY:y+6,head:[["Dados do culto",""]],body:culto,theme:"grid",styles:{font:"helvetica",fontSize:10.5,cellPadding:7,textColor:[35,48,41],lineColor:[228,232,229]},headStyles:{fillColor:headFill,textColor:headText,fontStyle:"bold"},columnStyles:{0:{cellWidth:150,fontStyle:"bold",textColor:greenD}},margin:{left:M,right:M}});
    y=doc.lastAutoTable.finalY+18;

    var total=CATS.reduce(function(s,c){return s+counts[c.name];},0);
    doc.autoTable({
      startY:y,
      head:[["Categoria","Quantidade"]],
      body:CATS.map(function(c){return [c.name,String(counts[c.name])];}),
      foot:[["TOTAL DE PRESENTES",String(total)]],
      theme:"grid",
      styles:{font:"helvetica",fontSize:11,cellPadding:7,textColor:[35,48,41],lineColor:[228,232,229]},
      headStyles:{fillColor:headFill,textColor:headText,fontStyle:"bold"},
      footStyles:{fillColor:greenTint,textColor:greenD,fontStyle:"bold",fontSize:12},
      columnStyles:{1:{halign:"center",cellWidth:130}},
      margin:{left:M,right:M}
    });
    y=doc.lastAutoTable.finalY+18;

    doc.autoTable({
      startY:y,
      head:[["Indicador","Total"]],
      body:(function(){var a=[["Anciãos",String(ancioes)],["Visitantes",String(visitantes.length)],["Novos convertidos",String(novos)]];if(tipo==="Culto de Santa Ceia (1º Domingo)"){a.push(["Membros participantes (Ceia)",String(ceiaMembros)]);a.push(["Tomaram a Ceia",String(ceiaTomaram)]);}return a;})(),
      theme:"grid",
      styles:{font:"helvetica",fontSize:11,cellPadding:7,textColor:[35,48,41],lineColor:[228,232,229]},
      headStyles:{fillColor:headFill,textColor:headText,fontStyle:"bold"},
      columnStyles:{1:{halign:"center",cellWidth:130}},
      margin:{left:M,right:M}
    });
    y=doc.lastAutoTable.finalY+18;

    if(visitantes.length){
      doc.autoTable({
        startY:y,
        head:[["#","Nome do visitante","Proveniência"]],
        body:visitantes.map(function(v,i){return [String(i+1),(v.nome&&v.nome.trim())?v.nome.trim():"—",(v.origem&&v.origem.trim())?v.origem.trim():"—"];}),
        theme:"striped",
        styles:{font:"helvetica",fontSize:10.5,cellPadding:6,textColor:[35,48,41]},
        headStyles:{fillColor:greenTint,textColor:greenD,fontStyle:"bold"},
        columnStyles:{0:{halign:"center",cellWidth:30}},
        margin:{left:M,right:M}
      });
      y=doc.lastAutoTable.finalY+18;
    }

    var pages=doc.internal.getNumberOfPages();
    for(var p=1;p<=pages;p++){
      doc.setPage(p); var H=doc.internal.pageSize.getHeight();
      doc.setDrawColor(228,232,229); doc.line(M,H-30,W-M,H-30);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(150,160,153);
      doc.text("Igreja Evangélica Assembleia de Deus — Alfa e Omega do Trevo", M, H-18);
      doc.text("Pág. "+p+"/"+pages, W-M, H-18, {align:"right"});
    }
    savePdfDoc(doc, "Relatorio_Culto_"+(val("data")||"culto")+".pdf");
  });
</script>

</body>
</html>
